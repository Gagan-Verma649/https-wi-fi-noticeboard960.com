<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABPS Notice Board</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #263449, #0b1120 65%);
    color: white;
}

/* =========================
   LOGIN PAGE
========================= */

.login-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    padding: 40px 32px;
    background: rgba(31, 41, 55, 0.95);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 5px;
}

.logo-line {
    width: 70px;
    height: 4px;
    background: #3b82f6;
    margin: 12px auto;
    border-radius: 10px;
}

.subtitle {
    color: #9ca3af;
    font-size: 15px;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

.input {
    width: 100%;
    padding: 15px;
    margin-bottom: 14px;
    border: 1px solid #374151;
    border-radius: 11px;
    background: #111827;
    color: white;
    font-size: 16px;
    outline: none;
}

.input:focus {
    border-color: #3b82f6;
}

.login-button,
.send-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 11px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover,
.send-button:hover {
    background: #1d4ed8;
}

.error {
    display: none;
    margin-top: 15px;
    color: #f87171;
    font-size: 14px;
}

.footer {
    margin-top: 28px;
    color: #6b7280;
    font-size: 13px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
    display: none;
    min-height: 100vh;
}

.header {
    padding: 22px;
    text-align: center;
    background: rgba(31, 41, 55, 0.95);
    border-bottom: 1px solid #374151;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 3px;
}

.header p {
    margin: 8px 0 0;
    color: #9ca3af;
}

.container {
    width: 90%;
    max-width: 650px;
    margin: 35px auto;
}

.card {
    background: #1f2937;
    padding: 28px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

.card h2 {
    margin-top: 0;
}

textarea {
    width: 100%;
    height: 130px;
    padding: 15px;
    border: 1px solid #374151;
    border-radius: 12px;
    background: #111827;
    color: white;
    font-size: 17px;
    outline: none;
    resize: none;
}

textarea:focus {
    border-color: #3b82f6;
}

.counter {
    text-align: right;
    color: #9ca3af;
    font-size: 13px;
    margin-top: 6px;
}

.current {
    margin-top: 25px;
    padding: 20px;
    border-radius: 13px;
    background: #111827;
    border: 1px solid #374151;
}

.current-title {
    color: #9ca3af;
    font-size: 13px;
    margin-bottom: 10px;
}

.current-notice {
    font-size: 19px;
    word-break: break-word;
}

.status {
    margin-top: 20px;
    text-align: center;
    color: #22c55e;
    font-weight: bold;
}

.logout {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #374151;
    color: white;
    cursor: pointer;
}

.logout:hover {
    background: #4b5563;
}

.sent {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #14532d;
    border-radius: 10px;
    color: #86efac;
    text-align: center;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .logo {
        font-size: 34px;
    }

    .header h1 {
        font-size: 23px;
    }

    .card {
        padding: 20px;
    }
}

</style>
</head>

<body>


<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <div class="logo">
            ABPS
        </div>

        <div class="logo-line"></div>

        <div class="subtitle">
            NOTICE BOARD
        </div>

        <input
            class="input"
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="off">

        <input
            class="input"
            id="password"
            type="password"
            placeholder="Password">

        <button
            class="login-button"
            onclick="login()">

            LOGIN

        </button>

        <div class="error" id="loginError">
            Invalid username or password.
        </div>

        <div class="footer">
            ESP8266 WI-FI NOTICE BOARD
        </div>

    </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div class="dashboard" id="dashboard">

    <div class="header">

        <h1>
            ABPS NOTICE BOARD
        </h1>

        <p>
            ESP8266 CONTROL PANEL
        </p>

    </div>


    <div class="container">

        <div class="card">

            <h2>
                Send Notice
            </h2>

            <textarea
                id="noticeInput"
                maxlength="32"
                placeholder="Type your notice here..."
                oninput="updateCounter()"></textarea>

            <div class="counter">
                <span id="counter">0</span>/32
            </div>

            <button
                class="send-button"
                onclick="sendNotice()">

                SEND NOTICE

            </button>


            <div class="sent" id="sentMessage">
                ✓ Notice sent successfully
            </div>


            <div class="current">

                <div class="current-title">
                    CURRENT NOTICE
                </div>

                <div
                    class="current-notice"
                    id="currentNotice">

                    WELCOME TO ABPS

                </div>

            </div>


            <div class="status">
                ● ESP8266 ONLINE
            </div>


            <button
                class="logout"
                onclick="logout()">

                LOG OUT

            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   ESP8266 SETTINGS
========================= */

const ESP8266_IP = "10.75.37.171";

const ESP8266_URL =
    "http://" + ESP8266_IP;


/* =========================
   LOGIN
========================= */

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");


    if (
        username === "AGTTD" &&
        password === "12345"
    ) {

        error.style.display = "none";

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "block";

    } else {

        error.style.display = "block";

    }
}


/* =========================
   SEND NOTICE
========================= */

function sendNotice() {

    const input =
        document.getElementById("noticeInput");

    const message =
        input.value.trim();

    if (message === "") {

        alert("Please enter a notice.");

        return;
    }


    /*
       Send notice to ESP8266.

       Example:
       http://10.75.37.171/send?message=Hello
    */

    const url =
        ESP8266_URL +
        "/send?message=" +
        encodeURIComponent(message);


    fetch(url, {
        method: "GET"
    })

    .then(function(response) {

        if (!response.ok) {
            throw new Error("ESP8266 error");
        }

        return response.text();

    })

    .then(function() {

        document.getElementById("currentNotice")
            .textContent = message;

        document.getElementById("sentMessage")
            .style.display = "block";

        input.value = "";

        updateCounter();


        setTimeout(function() {

            document.getElementById("sentMessage")
                .style.display = "none";

        }, 3000);

    })

    .catch(function(error) {

        alert(
            "Could not connect to ESP8266.\n\n" +
            "Make sure your computer is connected to the same Wi-Fi hotspot as the ESP8266."
        );

        console.log(error);

    });
}


/* =========================
   CHARACTER COUNTER
========================= */

function updateCounter() {

    const input =
        document.getElementById("noticeInput");

    document.getElementById("counter")
        .textContent = input.value.length;
}


/* =========================
   LOGOUT
========================= */

function logout() {

    document.getElementById("dashboard")
        .style.display = "none";

    document.getElementById("loginPage")
        .style.display = "flex";

    document.getElementById("username")
        .value = "";

    document.getElementById("password")
        .value = "";

}


/* =========================
   ENTER KEY LOGIN
========================= */

document.getElementById("password")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            login();

        }

    });

</script>

</body>

</html>
